name: CI

on:
  pull_request:
  push:
    branches: [claude/cloud-session-history-rvqkm1]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # One test file at a time: several files assert their own time budgets (bridges, terrain and
      # water benchmarks), which only hold when nothing else is running beside them.
      - name: Tests
        run: npx vitest run --no-file-parallelism
