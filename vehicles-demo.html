<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#12161e" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%235cb83a' d='M0 0H25L32 7V32H0Z'/%3E%3Cpath fill='%230f3322' d='M3 25L12 8.5L11 25Z'/%3E%3Cpath fill='%231f5e3f' d='M12 8.5L17 17L11 25Z'/%3E%3Cpath fill='%23174a31' d='M11 25L17 17L22 25Z'/%3E%3Cpath fill='%230f3322' d='M17 17L22 11.5L22 25Z'/%3E%3Cpath fill='%232a7a50' d='M22 11.5L29 25H22Z'/%3E%3C/svg%3E" />
    <title>Vehicle library</title>
    <style>
      :root { --bg: #12161e; --panel: rgba(18, 22, 30, 0.88); --ink: #eef1f5; --dim: #9aa4b2; --acc: #f2c21a; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font: 13px/1.35 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
      #top { position: fixed; left: 0; right: 0; top: 0; padding: 8px 10px calc(6px) 10px; padding-top: max(8px, env(safe-area-inset-top)); background: var(--panel); backdrop-filter: blur(6px); z-index: 2; }
      #top h1 { font-size: 15px; margin: 0 0 6px; display: flex; gap: 8px; align-items: baseline; }
      #top h1 small { color: var(--dim); font-weight: 400; font-size: 11px; font-variant-numeric: tabular-nums; }
      .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
      button, select { background: #222936; color: var(--ink); border: 1px solid #333c4c; border-radius: 8px; padding: 6px 9px; font: inherit; }
      button.on { background: var(--acc); color: #111; border-color: var(--acc); font-weight: 600; }
      select { max-width: 46vw; }
      label { color: var(--dim); display: flex; gap: 4px; align-items: center; }
      input[type=range] { width: 120px; }
      #card { position: fixed; left: 8px; right: 8px; bottom: max(8px, env(safe-area-inset-bottom)); background: var(--panel); border-radius: 12px; padding: 10px 12px; z-index: 2; display: none; }
      #card h2 { margin: 0; font-size: 16px; }
      #card .sub { color: var(--dim); margin: 2px 0 6px; }
      #card table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
      #card td { padding: 1px 0; } #card td:last-child { text-align: right; }
      #card .plate { height: 18px; vertical-align: middle; border-radius: 2px; }
      .sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; border: 1px solid #0006; vertical-align: middle; margin-right: 2px; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="top"></div>
    <div id="card"></div>
    <!-- opened from the start menu's Library: a way back, and no developer readouts (src/app/library.ts; first, to read the address before the page rewrites it) -->
    <script type="module" src="/src/app/library.ts"></script>
    <script type="module" src="/src/proto/vehicles/demo.ts"></script>
  </body>
</html>
